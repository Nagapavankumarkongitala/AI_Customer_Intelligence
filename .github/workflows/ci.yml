name: ci
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall app.py pages services analytics churn retention_engine feature_engineering visualization components utils tests
      - name: Lint
        run: ruff check .
      - name: Format check
        run: black --check .
      - name: Tests with coverage
        run: pytest -q --cov=. --cov-report=term-missing
