[theme]
# Professional light analytics surface (design tokens: visualization/tokens.py).
# Risk states keep red/green/amber hues; meaning always rides on labels, never
# colour alone. The navy/cyan console is retained as the selectable dark skin.
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F6F8FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[server]
headless = true
maxUploadSize = 500

[client]
showSidebarNavigation = false
