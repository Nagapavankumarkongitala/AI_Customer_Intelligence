[theme]
# Obsidian terminal: black canvas, volt-lime accents. Risk states keep
# red/green/amber hues; meaning always rides on labels, never color alone.
base = "dark"
primaryColor = "#CCFF00"
backgroundColor = "#050505"
secondaryBackgroundColor = "#141414"
textColor = "#E8E8E8"
font = "sans serif"

[server]
headless = true
