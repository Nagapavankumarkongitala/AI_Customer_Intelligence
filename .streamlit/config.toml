[theme]
# Deep navy terminal: navy canvas, cyan accents. Risk states keep
# red/green/amber hues; meaning always rides on labels, never color alone.
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#070B14"
secondaryBackgroundColor = "#0D1930"
textColor = "#E8EEF6"
font = "sans serif"

[server]
headless = true

[client]
showSidebarNavigation = false
