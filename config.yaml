# Business configuration (spec §7). Validated at startup; keep values documented here.
app:
  name: AI Customer Intelligence Platform
  currency_symbol: "₹"
  random_seed: 42

quality:
  age_min: 0
  age_max: 120
  future_date_tolerance_days: 0
  outlier_iqr_multiplier: 1.5

rfm:
  quantiles: 5
  snapshot_offset_days: 1

segmentation:
  minimum_customers: 50
  cluster_range: [2, 10]
  default_features:
    - recency_days
    - frequency
    - monetary_value
    - relationship_length_days
    - average_order_value

churn:
  default_outcome_horizon_days: 90
  risk_bands:
    low: [0.0, 0.30]
    medium: [0.30, 0.60]
    high: [0.60, 0.80]
    critical: [0.80, 1.0]

retention:
  value_quantiles: 3
  strategic_weight_default: 1.0
